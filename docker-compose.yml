# ローカル開発・結合テスト用の Postgres（本番の DB とは別）
#   起動: docker compose up -d
#   停止: docker compose down（データも消すなら docker compose down -v）
services:
  db:
    image: postgres:16
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: office_manager
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
